<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Notes App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

    <main class="container">

        <header>
            <p class="tag">MY SPACE</p>
            <h1>My Notes</h1>
            <p class="subtitle">Capture your thoughts, ideas and reminders.</p>
        </header>

        <section class="note-input">

            <textarea id="note-content" placeholder="Write something..."></textarea>

            <div class="input-footer">
                <span>New note</span>
                <button id="add-note">+</button>
            </div>

        </section>

        <section class="note-section"></section>

    </main>

    <script src="script.js"></script>
</body>

</html>
