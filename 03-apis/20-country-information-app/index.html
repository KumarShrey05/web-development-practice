<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Country Information App</title>
</head>

<body>

    <main class="container">

        <h1>Country Information</h1>
        <p>Search for any country and explore its information.</p>

        <form id="countryForm">

            <label for="countryInput">Country</label>

            <input type="text" id="countryInput" placeholder="Enter country name..." autocomplete="off" required>

            <button type="submit">Search</button>

        </form>

        <div id="countryResult"></div>

    </main>

    <script src="script.js"></script>

</body>

</html>
